# Mucha-Inspired Media Player - Homage to Sarah Bernhardt
# Based on the iconic 1899 poster for "Tosca" [citation:4]

type: picture-elements
image: /local/mucha/sarah-bernardt-tosca.jpg
elements:
  - type: state-icon
    entity: media_player.living_room
    style:
      top: 75%
      left: 15%
      --paper-item-icon-color: "#b6c8a7"
      --paper-item-icon-active-color: "#d9b8a6"
  
  - type: state-label
    entity: media_player.living_room
    attribute: media_title
    style:
      top: 70%
      left: 25%
      right: 10%
      color: "#5c4e3d"
      font-family: "Cormorant Garamond", serif
      font-size: 16px
      text-shadow: 1px 1px 2px rgba(255,255,255,0.8)
      background: rgba(255, 249, 242, 0.7)
      padding: 4px 12px
      border-radius: 20px 4px 20px 4px
  
  - type: custom:button-card
    entity: media_player.living_room
    tap_action:
      action: call-service
      service: media_player.media_play_pause
    icon: mdi:play-pause
    style:
      top: 80%
      left: 45%
      background: rgba(217, 184, 166, 0.3)
      border: 2px solid #d9b8a6
      border-radius: 50%
      width: 48px
      height: 48px
      animation: soft-glow 3s ease-in-out infinite
  
  - type: custom:button-card
    entity: media_player.living_room
    tap_action:
      action: call-service
      service: media_player.media_next_track
    icon: mdi:skip-next
    style:
      top: 80%
      left: 55%
      background: rgba(217, 184, 166, 0.3)
      border: 2px solid #d9b8a6
      border-radius: 50%
      width: 48px
      height: 48px
